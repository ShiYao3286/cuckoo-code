<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>写作台</title>
  <style>
    /* ===== 基础 ===== */
    :root {
      --nv-bg: #14161c;
      --nv-panel: #1a1d25;
      --nv-panel-2: #20242e;
      --nv-border: #2a2f3a;
      --nv-text: #d7dce6;
      --nv-text-dim: #8b93a3;
      --nv-accent: #8b93ff;
      --nv-accent-dim: #4a4f7a;
      --nv-green: #4ade80;
      --nv-red: #f87171;
      --nv-amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--nv-bg); color: var(--nv-text);
      font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    #app { display: flex; height: 100%; }

    /* ===== 顶栏 ===== */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 42px;
      display: flex; align-items: center; gap: 12px;
      padding: 0 14px; background: var(--nv-panel);
      border-bottom: 1px solid var(--nv-border); z-index: 20;
    }
    #topbar .title { font-weight: 700; color: var(--nv-accent); font-size: 15px; }
    #topbar .project {
      font-size: 12px; color: var(--nv-text-dim); max-width: 40%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #topbar .spacer { flex: 1; }
    .btn {
      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
      background: var(--nv-panel-2); border: 1px solid var(--nv-border);
      color: var(--nv-text); transition: background .15s, border-color .15s;
    }
    .btn:hover { background: #262b36; border-color: #3a4150; }
    .btn.primary { background: var(--nv-accent-dim); border-color: var(--nv-accent); color: #e8eaff; }
    .btn.primary:hover { background: #565c8f; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sm { padding: 3px 9px; font-size: 12px; }

    /* ===== 三栏布局 ===== */
    #main {
      display: flex; width: 100%; height: 100%;
      padding-top: 42px;
    }
    #left {
      width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--nv-panel); border-right: 1px solid var(--nv-border);
      min-height: 0;
    }
    #center {
      flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0;
    }
    #right {
      width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--nv-panel); border-left: 1px solid var(--nv-border);
      min-height: 0;
    }

    /* ===== 左：章节 / 设定 ===== */
    .pane-head {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
      padding: 10px 12px; font-size: 11px; font-weight: 700;
      color: var(--nv-text-dim); letter-spacing: 1px; text-transform: uppercase;
      border-bottom: 1px solid var(--nv-border);
    }
    .pane-head .count { margin-left: auto; font-weight: 400; letter-spacing: 0; }
    .pane-body { flex: 1; overflow-y: auto; min-height: 0; padding: 6px 0; }
    .pane-body::-webkit-scrollbar { width: 8px; }
    .pane-body::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }

    .chap-item {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; cursor: pointer; font-size: 13px;
      border-left: 2px solid transparent; color: var(--nv-text-dim);
    }
    .chap-item:hover { background: var(--nv-panel-2); color: var(--nv-text); }
    .chap-item.active {
      background: #232839; color: #e8eaff;
      border-left-color: var(--nv-accent);
    }
    .chap-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chap-item .wc { font-size: 11px; color: #5b6373; flex-shrink: 0; }
    .chap-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--nv-amber); flex-shrink: 0; }

    #leftSplit {
      height: 1px; background: var(--nv-border); flex-shrink: 0;
    }
    #settingsPane { max-height: 42%; display: flex; flex-direction: column; min-height: 0; }

    /* ===== 中：编辑区 ===== */
    #editorHead {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 10px 18px; border-bottom: 1px solid var(--nv-border);
      background: var(--nv-panel);
    }
    #fileName {
      font-size: 13px; font-weight: 600; color: var(--nv-text);
      font-family: "Cascadia Code", Consolas, monospace;
    }
    #saveState { font-size: 12px; color: var(--nv-text-dim); margin-left: auto; }
    #saveState.dirty { color: var(--nv-amber); }
    #saveState.saved { color: var(--nv-green); }
    #wordCount { font-size: 12px; color: var(--nv-text-dim); }

    #editorWrap { flex: 1; position: relative; min-height: 0; }
    #editor {
      width: 100%; height: 100%; resize: none; outline: none;
      border: none; padding: 28px 40px; background: var(--nv-bg);
      color: var(--nv-text);
      font: 16px/1.95 "Songti SC", "SimSun", "Microsoft YaHei", serif;
      letter-spacing: .3px;
    }
    #editor::placeholder { color: #4a5160; }
    #editor::-webkit-scrollbar { width: 10px; }
    #editor::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 5px; }

    /* 空状态 */
    #emptyState {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: var(--nv-text-dim); font-size: 14px; text-align: center; padding: 40px;
    }
    #emptyState.hidden { display: none; }
    #emptyState .big { font-size: 44px; opacity: .35; }
    #emptyState .hint { font-size: 12px; color: #5b6373; line-height: 2; }

    /* ===== 右：AI 对话 ===== */
    #chatBody {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    #chatBody::-webkit-scrollbar { width: 8px; }
    #chatBody::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }

    .msg { display: flex; flex-direction: column; gap: 3px; }
    .msg .who { font-size: 11px; color: #5b6373; letter-spacing: .5px; }
    .msg .bubble {
      padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.75;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: #262b3a; color: #d7dce6; }
    .msg.ai .bubble { background: var(--nv-panel-2); border: 1px solid var(--nv-border); }
    .msg.ai.streaming .bubble { border-color: var(--nv-accent-dim); }
    .msg.ai .bubble .cursor {
      display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
      background: var(--nv-accent); animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .msg .actions { display: flex; gap: 6px; margin-top: 2px; }
    .msg.sys .bubble {
      background: transparent; border: 1px dashed var(--nv-border);
      color: var(--nv-text-dim); font-size: 12px;
    }

    #chatInputWrap {
      flex-shrink: 0; border-top: 1px solid var(--nv-border); padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #quickActions { display: flex; gap: 6px; flex-wrap: wrap; }
    #chatInput {
      width: 100%; height: 68px; resize: none; outline: none;
      padding: 9px 11px; border-radius: 8px; font-size: 13px; line-height: 1.6;
      background: #0f1117; border: 1px solid var(--nv-border); color: var(--nv-text);
      font-family: inherit;
    }
    #chatInput:focus { border-color: var(--nv-accent-dim); }
    #chatInputBar { display: flex; align-items: center; gap: 8px; }
    #chatHint { font-size: 11px; color: #5b6373; flex: 1; }

    /* ===== 浮动选区工具条 ===== */
    #selBar {
      position: fixed; display: none; z-index: 100;
      background: #232839; border: 1px solid var(--nv-accent-dim);
      border-radius: 8px; padding: 4px; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      display: none;
    }
    #selBar.show { display: flex; }
    #selBar .sb {
      padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer;
      color: var(--nv-text); white-space: nowrap;
    }
    #selBar .sb:hover { background: var(--nv-accent-dim); }

    /* ===== 状态条 ===== */
    #statusbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 24px;
      display: flex; align-items: center; gap: 14px; padding: 0 12px;
      background: var(--nv-panel); border-top: 1px solid var(--nv-border);
      font-size: 11px; color: #5b6373; z-index: 20;
    }
    #main { padding-bottom: 24px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #232839; border: 1px solid var(--nv-border);
      padding: 9px 18px; border-radius: 8px; font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="title">写作台</span>
    <span class="project" id="projectPath">未初始化项目</span>
    <span class="spacer"></span>
    <button class="btn sm" id="btnNewChapter" title="新建章节">+ 新章节</button>
    <button class="btn sm" id="btnRefactor" title="刷新章节列表">⟳</button>
    <button class="btn" id="btnBackWeb">回到网页模式</button>
  </div>

  <div id="main">
    <!-- 左栏 -->
    <div id="left">
      <div class="pane-head">
        <span>章节</span><span class="count" id="chapCount"></span>
      </div>
      <div class="pane-body" id="chapterList"></div>
      <div id="leftSplit"></div>
      <div id="settingsPane">
        <div class="pane-head">
          <span>设定</span><span class="count" id="settingCount"></span>
        </div>
        <div class="pane-body" id="settingList"></div>
      </div>
    </div>

    <!-- 中栏 -->
    <div id="center">
      <div id="editorHead">
        <span id="fileName">未选择章节</span>
        <span id="wordCount"></span>
        <span id="saveState"></span>
      </div>
      <div id="editorWrap">
        <textarea id="editor" placeholder="在左侧选择章节，或点「+ 新章节」开始写作…" spellcheck="false"></textarea>
        <div id="emptyState">
          <div class="big">✍</div>
          <div>还没有打开任何章节</div>
          <div class="hint">
            初始化项目后，正文会保存在<br>
            <code>novel/章节/</code> 目录下
          </div>
        </div>
      </div>
    </div>

    <!-- 右栏 -->
    <div id="right">
      <div class="pane-head">
        <span>AI 写作助手</span>
        <span class="count" id="chatState"></span>
      </div>
      <div id="chatBody"></div>
      <div id="chatInputWrap">
        <div id="quickActions">
          <button class="btn sm" data-quick="继续写">继续写</button>
          <button class="btn sm" data-quick="润色选中">润色选中</button>
          <button class="btn sm" data-quick="扩写">扩写</button>
          <button class="btn sm" data-quick="精简">精简</button>
          <button class="btn sm" data-quick="列大纲">列大纲</button>
        </div>
        <textarea id="chatInput" placeholder="和 AI 讨论剧情，或让它续写…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div id="chatInputBar">
          <span id="chatHint">选中正文文字后，可用上方快捷指令</span>
          <button class="btn primary" id="btnSend">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="stProject">—</span>
    <span id="stChapter">—</span>
    <span id="stWords">—</span>
    <span class="spacer" style="flex:1"></span>
    <span id="stAi"></span>
  </div>

  <div id="selBar">
    <div class="sb" data-act="polish">润色</div>
    <div class="sb" data-act="expand">扩写</div>
    <div class="sb" data-act="condense">精简</div>
    <div class="sb" data-act="rewrite">改写</div>
  </div>

  <div id="toast"></div>

  <!-- 逻辑在 src/ui/novel.ts，由 scripts/build-novel.mjs 经 esbuild 打包成
       src/ui/novel.js（自包含 IIFE）。不用 type="module"：file:// 下模块加载受限。 -->
  <script>
    // 脚本加载失败的兜底：这类问题在纯净的 UI 上很难看出来（只表现为"什么都没发生"）
    window.addEventListener('error', function (e) {
      var t = document.getElementById('toast');
      if (t) { t.textContent = '脚本错误: ' + (e.message || e.type); t.classList.add('show'); }
    }, true);
    setTimeout(function () {
      if (!window.__novelBooted) {
        var st = document.getElementById('stProject');
        if (st) st.textContent = 'novel.js 未加载（请运行 npm run compile）';
      }
    }, 3000);
  </script>
  <script src="./novel.js"></script>
</body>
</html>
